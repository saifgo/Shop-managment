security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Infrastructure\Persistence\Entity\Identity\User: 'auto'

    providers:
        app_user_provider:
            id: App\Infrastructure\Security\AppUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Infrastructure\Security\JwtAuthenticator

    access_control:
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/ready, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
        # Anchored so it only exposes /api/doc and /api/doc.json, not /api/documents.
        - { path: ^/api/doc(\.json)?$, roles: PUBLIC_ACCESS }
        # Uploaded product pictures, loaded by <img> tags that cannot send a bearer token.
        - { path: ^/api/media/, roles: PUBLIC_ACCESS, methods: [GET] }
        # Share links for issued documents; the random token in the URL is the credential.
        - { path: ^/api/public/, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
